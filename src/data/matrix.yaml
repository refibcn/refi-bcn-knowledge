# src/data/matrix.yaml
# MATRIX DEFINITIONS — the asserted cells of the home matrix (layers × containers),
# the collections.yaml pattern: definitions in one reviewed file, computation in
# src/lib/matrix.mjs. Computed values (store counts, review counts, dispositions,
# card locations) come from the view-models at build and ALWAYS beat what is
# written here; this file carries only what cannot be computed — mechanisms,
# ontologies, gates, owners, and locations/origins for columns that have no card
# yet (PLANNED_SOURCES doctrine: no card until the batch runs).
#
# 260811 architecture (D11): separate containers, each with its own ontology; a
# common layer defined gradually. A blocked cell names its gate and its owner.
